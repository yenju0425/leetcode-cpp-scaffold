name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build-and-test:
    name: Build, Static Analysis and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ cppcheck libgtest-dev libboost-all-dev

      - name: Build Google Test
        run: |
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib/ 2>/dev/null || sudo cp *.a /usr/lib/

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cppcheck
        run: cmake --build build --target cppcheck

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ./build/unit_test --gtest_output=xml:build/test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/test-results.xml

  submit-to-leetcode:
    name: Submit to LeetCode
    runs-on: ubuntu-latest
    needs: build-and-test
    # Run on: PR from same repo, or push to main/master, or manual trigger
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need 2 commits to compare

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore saved session
        env:
          LEETCODE_STORAGE_STATE: ${{ secrets.LEETCODE_STORAGE_STATE }}
        run: |
          if [ -z "$LEETCODE_STORAGE_STATE" ]; then
            echo "⚠ No LEETCODE_STORAGE_STATE secret set, skipping"
            exit 0
          fi
          mkdir -p ~/.cache/leetcode-submit
          echo "$LEETCODE_STORAGE_STATE" | base64 -d > ~/.cache/leetcode-submit/storage_state.json
          echo "✅ Storage state restored from secret"

      - name: Get changed files
        run: bash scripts/get_changed_files.sh "${{ github.event_name }}" "${{ github.base_ref }}"

      - name: Submit solutions to LeetCode
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_PASSWORD: ${{ secrets.GH_PASSWORD }}
          SCREENSHOT_DIR: /tmp/leetcode-screenshots
        run: bash scripts/submit_to_leetcode.sh

      - name: Upload debug screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leetcode-debug-screenshots
          path: /tmp/leetcode-screenshots/
          retention-days: 7
          if-no-files-found: ignore